project:
  name: "Nagpur_District_Cell_Tower_Planning"
  seed: 42
  crs: "EPSG:32644"  # UTM Zone 44N for Nagpur region

optimization:
  num_towers: 80           # District-scale budget (was 50 for city-only)
  grid_resolution: 750     # metres — covers 9,928 km² in ~17,650 points (was 500m/39k)
  population_per_user: 10
  traffic_per_user_mbps: 2.5
  min_tower_distance: 500  # metres

# ─── RF Parameters ────────────────────────────────────────────────────────────
# Source: Airtel India macro BTS specifications (Band 3 / 1800 MHz FDD)
# Equipment ref: Ericsson AIR 2219 / Nokia AirScale AHHAbf  +  standard 65-deg panel
#
# EIRP (Effective Isotropic Radiated Power) per sector:
#   EIRP = Tx_power + Antenna_gain - Cable_loss
#        = 46 + 18 - 2 = 62 dBm
#
# Expected COST-231 Hata coverage radius at RSRP -95 dBm threshold:
#   max_path_loss = 62 - (-95) = 157 dB
#   Using 1800 MHz, 35m antenna → radius ≈ 3.45 km
#   (matches Airtel suburban cell sizes in Tier-2 Indian cities)
# ──────────────────────────────────────────────────────────────────────────────
rf_params:
  frequency_mhz: 1800         # Band 3 (FDD 1800 MHz) — Airtel India primary coverage band
                               # Ref: TRAI spectrum allocation, Airtel annual report 2023-24

  bandwidth_mhz: 20            # 20 MHz FDD channel (standard Band 3 allocation in India)

  transmit_power_dbm: 46       # 40 W per antenna port (Ericsson AIR 2219 spec: max 2×40W)
                               # Regulatory limit: TRAI/WPC type-approval @ 43-46 dBm

  antenna_gain_dbi: 18         # 65° HPBW sector panel (3GPP TR 36.814 reference antenna)
                               # Typical: 17-19 dBi for 65°×7° panel (e.g., Kathrein 742215)

  cable_loss_db: 2             # Jumper cable + connectors from BTS to antenna port
                               # Typical: 0.5 dB jumper + 1.5 dB feeder run = 2 dB total

  antenna_height_m: 35         # Typical Nagpur macro tower height (Tier-2 city)
                               # Urban core: 25-35 m | Suburban: 35-50 m (using 35m mean)

  receiver_height_m: 1.5       # 3GPP TR 36.814 standard UE (handset) height

  propagation_model: "COST231" # COST-231 Hata — valid for 150-2000 MHz, 1-20 km range
                               # Ref: COST Action 231 Final Report, 1999

# ─── Coverage Thresholds ──────────────────────────────────────────────────────
thresholds:
  rsrp_min_dbm: -95            # Indoor coverage planning threshold (Airtel India standard)
  sinr_min_db: -6              # Minimum SINR for basic LTE connectivity

# ─── Multi-tier Tower Specifications ──────────────────────────────────────────
# Three tiers matching real Airtel India deployments:
#   Macro  — Ground-Based Tower/Mast (GBT/GBM), primary coverage layer
#   Micro  — Street-level cabinet (10-15m), fills dense urban/town gaps
#   Small  — Lamppost/rooftop node, fills indoor/hotspot demand
#
# Coverage radius computed via COST-231 Hata inversion at RSRP = -95 dBm:
#   Macro : EIRP 62 dBm, h=35m  → 3,454 m
#   Micro : EIRP 41 dBm, h=12m  →   600 m
#   Small : EIRP 28 dBm, h= 6m  →   150 m
# ──────────────────────────────────────────────────────────────────────────────
tower_types:
  macro:
    height_m: 35
    tx_power_dbm: 46          # Ericsson AIR 2219, 40W/port
    antenna_gain_dbi: 18      # 65° sector panel
    cable_loss_db: 2
    eirp_dbm: 62              # 46 + 18 - 2
    coverage_radius_m: 3454   # COST-231 at RSRP -95 dBm
    color: "red"
    display_name: "Macro Cell (GBT/GBM)"
    airtel_equivalent: 1200   # ~1,200 Airtel macro sites in Nagpur district (TRAI data)
    deploy_budget: 80

  micro:
    height_m: 12
    tx_power_dbm: 37          # 5 W output (typical micro BTS)
    antenna_gain_dbi: 5       # Omnidirectional / low-profile panel
    cable_loss_db: 1
    eirp_dbm: 41              # 37 + 5 - 1
    coverage_radius_m: 600    # COST-231 at RSRP -95 dBm
    color: "orange"
    display_name: "Micro Cell"
    airtel_equivalent: 0
    deploy_budget: 100

  small_cell:
    height_m: 6
    tx_power_dbm: 24          # 250 mW output (typical small cell node)
    antenna_gain_dbi: 5
    cable_loss_db: 1
    eirp_dbm: 28              # 24 + 5 - 1
    coverage_radius_m: 150    # COST-231 at RSRP -95 dBm
    color: "#FFD700"
    display_name: "Small Cell"
    airtel_equivalent: 0
    deploy_budget: 150

# ─── Multi-tier Optimizer Settings ────────────────────────────────────────────
multi_tier:
  micro_demand_threshold_pct: 50   # micro fills gaps where demand > 50th percentile
  small_cell_demand_threshold_pct: 70  # small cells target top-30% demand hotspots
  airtel_total_sites: 1200         # reference for "AI vs Airtel" comparison table

nsga2:
  pop_size: 40
  n_gen: 40

paths:
  boundary_shp: "Data/raw/Boundaries/gadm41_IND_2.shp"
  dem_tif: "Data/raw/srtm_dem.tif"
  pop_tif: "Data/raw/population.tif"
  airtel_coverage: "Data/raw/airtel_coverage.shp"
  output_dir: "outputs"
