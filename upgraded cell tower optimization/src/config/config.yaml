project:
  name: "Nagpur_Cell_Tower_Planning"
  seed: 42
  crs: "EPSG:32644"  # UTM Zone 44N for Nagpur region

optimization:
  num_towers: 50      # target towers in final solution
  grid_resolution: 500  # metres — 500m balances detail vs. run time (~26k grid points for Nagpur)
  population_per_user: 10
  traffic_per_user_mbps: 2.5
  min_tower_distance: 500  # metres

rf_params:
  frequency_mhz: 2100
  bandwidth_mhz: 20
  transmit_power_dbm: 43   # 20W typical macro BTS
  antenna_height_m: 30
  receiver_height_m: 1.5
  propagation_model: "COST231"

thresholds:
  rsrp_min_dbm: -110       # 3GPP TS 36.133 minimum for LTE

nsga2:
  pop_size: 40
  n_gen: 40

paths:
  boundary_shp: "Data/raw/Boundaries/gadm41_IND_2.shp"
  dem_tif: "Data/raw/srtm_dem.tif"
  pop_tif: "Data/raw/population.tif"
  airtel_coverage: "Data/raw/airtel_coverage.shp"
  output_dir: "outputs"
